[book]
title = "AI 代码审查：原理、方法与评价"
description = "代码审查的职责、上下文、工程判断、风险表达与质量评价"
language = "zh-CN"
src = ".build/src"

[build]
build-dir = "dist"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/custom.css"]
smart-punctuation = true

[output.html.fold]
enable = true
level = 1

[output.html.playground]
runnable = false
